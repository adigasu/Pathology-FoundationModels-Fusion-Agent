    max_slide_file: "artifacts/features/virchow2_slide_max.pt"
    tiles_fp16_file: "artifacts/features/virchow2_tiles_fp16.pt"

  gigapath:
    name: "prov-gigapath/prov-gigapath"
    architecture: "ViT-Giant/14"
    dimension: 1536
    weights_access: "Hugging Face (instant)"
